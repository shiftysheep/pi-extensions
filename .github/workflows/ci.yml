name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  # On merge to main: bump the version from the merged commits (feat -> minor,
  # fix/chore -> patch, breaking -> major) and release via an automatic PR.
  # cz infers the increment from conventional commits since the last tag; the
  # bump_message/tag_format come from .cz.toml.
  #
  # main is branch-protected (PRs only) and a personal-account repo cannot grant
  # the github-actions app a bypass, so the release commit + tag ship on a
  # release/vX.Y.Z branch that this job merges once its check passes.
  release:
    needs: check
    # Skip the release commit this job itself merges (actor guard breaks the loop).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    # Serialize releases so back-to-back merges don't race on the tag.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # approve the release PR's own CI run (bot heads need approval)
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so cz can find the last release tag.
          fetch-depth: 0
      # commitizen's npm version provider shells out to `npm version`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Exact tag: setup-uv publishes no rolling major tag (v10 does not exist).
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Bump version and open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A concurrent release may have landed first (see concurrency group);
          # move to the tip of main before bumping.
          git pull --ff-only origin main
          # Nothing new to release? (e.g. this push merged a release PR itself,
          # whose only new commit is the merge commit.)
          last_tag=$(git describe --tags --abbrev=0)
          if [ -z "$(git log --no-merges --oneline "${last_tag}..HEAD")" ]; then
            echo "No non-merge commits since ${last_tag}; nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --with 'commitizen==4.18.*' cz bump --yes
          # cz created the release commit + tag locally. Ship the COMMIT on a
          # branch and merge it through a PR (direct pushes to main are
          # rejected). The tag is published only after the merge: a pushed tag
          # is installable and must never be moved.
          version=$(git tag --points-at HEAD)
          head_sha=$(git rev-parse HEAD)
          # force-with-lease: a retried run may already have pushed a stale
          # release/vX.Y.Z branch from an earlier attempt.
          git push --force-with-lease origin "HEAD:refs/heads/release/${version}"
          # Reuse the release PR if a previous attempt left one open.
          pr_number=$(gh pr list --head "release/${version}" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create --base main --head "release/${version}" \
              --title "chore(release): ${version}" \
              --body "Automatic release by the CI release job.")
            pr_number=${pr_url##*/}
          fi
          # The PR's pull_request CI run can take a few minutes to appear and,
          # for a head pushed by the bot, starts in the "action required" state
          # (reported as status "completed", conclusion "action_required").
          # Poll until a check is reported on the PR; approve the run for the
          # exact head commit as it appears (gh has no approve subcommand;
          # approval errors must fail the job, not be swallowed).
          for i in $(seq 1 20); do
            run_id=$(gh run list --branch "release/${version}" --limit 5 \
              --json databaseId,headSha,conclusion --jq \
              ".[] | select(.headSha == \"${head_sha}\" and .conclusion == \"action_required\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" -X POST
              echo "Approved run ${run_id}"
            fi
            if [ "$(gh pr view "$pr_number" --json statusCheckRollup --jq '.statusCheckRollup | length')" != "0" ]; then
              break
            fi
            sleep 15
          done
          # Wait for the required check, then merge (a PR merge is allowed by
          # protection). --match-head-commit refuses to merge a moved head.
          gh pr checks "$pr_number" --watch
          gh pr merge "$pr_number" --merge --delete-branch --match-head-commit "$head_sha"
          # Publish the tag now that the release commit is merged into main.
          # Plain push: fails loudly if the tag is published elsewhere, is a
          # no-op if it already points at this commit (retried run).
          git push origin "refs/tags/${version}"
