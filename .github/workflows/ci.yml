name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  # On merge to main: bump the version from the merged commits (feat -> minor,
  # fix/chore -> patch, breaking -> major) and release via an automatic PR.
  # cz infers the increment from conventional commits since the last tag; the
  # bump_message/tag_format come from .cz.toml.
  #
  # main is branch-protected (PRs only) and a personal-account repo cannot grant
  # the github-actions app a bypass, so the release commit + tag ship on a
  # release/vX.Y.Z branch that this job merges once its check passes.
  release:
    needs: check
    # Skip the release commit this job itself merges (actor guard breaks the loop).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    # Serialize releases so back-to-back merges don't race on the tag.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so cz can find the last release tag.
          fetch-depth: 0
      # commitizen's npm version provider shells out to `npm version`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Exact tag: setup-uv publishes no rolling major tag (v10 does not exist).
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Bump version and open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A concurrent release may have landed first (see concurrency group);
          # move to the tip of main before bumping.
          git pull --ff-only origin main
          # Nothing new to release? (e.g. this push merged a release PR itself,
          # whose only new commit is the merge commit.)
          last_tag=$(git describe --tags --abbrev=0)
          if [ -z "$(git log --no-merges --oneline "${last_tag}..HEAD")" ]; then
            echo "No non-merge commits since ${last_tag}; nothing to release."
            exit 0
          fi
          # A previous failed release attempt may have left a stray remote tag
          # for the version about to be computed; cz bump cannot recreate a tag
          # that already exists locally. Real release tags are always ancestors
          # of HEAD, so any non-ancestor tag is stray and safe to drop.
          for t in $(git tag -l 'v*'); do
            git merge-base --is-ancestor "$t" HEAD 2>/dev/null || git tag -d "$t" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --with 'commitizen==4.18.*' cz bump --yes
          # cz created the release commit + tag locally; ship them on a branch
          # and merge through a PR (direct pushes to main are rejected).
          version=$(git tag --points-at HEAD)
          # force-with-lease: a retried run may already have pushed stale
          # release/vX.Y.Z branch + tag refs from an earlier attempt.
          git push --force-with-lease origin "HEAD:refs/heads/release/${version}" "refs/tags/${version}"
          pr_url=$(gh pr create --base main --head "release/${version}" \
            --title "chore(release): ${version}" \
            --body "Automatic release by the CI release job.")
          pr_number=${pr_url##*/}
          # Wait for the required check, then merge (a PR merge is allowed by protection).
          gh pr checks "$pr_number" --watch
          gh pr merge "$pr_number" --merge --delete-branch
