# Python commitizen drives releases here (`cz bump`); the npm `cz` (via
# `npm run commit`) is only the interactive commit-message wizard.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
bump_message = "chore(release): v$new_version"
# npm provider: package.json + package-lock.json are the source of truth;
# version_files covers any other locations that carry the version.
version_provider = "npm"
version_files = [
    "README.md:pi-extensions@v\\d+\\.\\d+\\.\\d+",
]
changelog = false
